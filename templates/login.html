<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FaceAttend AI</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Theme Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at 20% 20%, rgba(0, 144, 231, 0.12) 0%, transparent 45%), radial-gradient(circle at 80% 80%, rgba(255, 20, 147, 0.10) 0%, transparent 50%), #07080b;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem; border: 1px solid rgba(0, 144, 231, 0.25); box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 144, 231, 0.15); background-color: #11141d;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-icon" style="margin: 0 auto 1.25rem auto; width: 52px; height: 52px; font-size: 1.6rem; border-radius: 14px;">
                <i class="fa-solid fa-camera-viewfinder"></i>
            </div>
            <h2 style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; color: var(--text-main);">FaceAttend AI</h2>
            <p style="font-size: 0.825rem; color: var(--text-muted); margin-top: 0.35rem; letter-spacing: 0.05em;">
                <span style="background: var(--gradient-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700;">Biometric</span> Administrator Authentication
            </p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-input" placeholder="admin" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In</span>
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
            <button onclick="fillDemoCredentials()" class="btn btn-outline btn-sm" style="width: 100%;">
                <i class="fa-solid fa-key"></i>
                <span>Fill Default Credentials</span>
            </button>
        </div>
    </div>

    <script>
        function fillDemoCredentials() {
            document.getElementById('loginUsername').value = 'admin';
            document.getElementById('loginPassword').value = 'admin123';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alert(data.error || 'Authentication failed.');
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }
    </script>
</body>
</html>
